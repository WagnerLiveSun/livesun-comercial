<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a Senha - LiveSun Comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ls-bg-main: #08111f;
            --ls-bg-elevated: #0d1728;
            --ls-border-subtle: rgba(160, 176, 204, 0.22);
            --ls-text-main: #e8eefc;
            --ls-text-muted: #a8b6cc;
            --ls-primary: #dfe7f4;
            --ls-accent: #8fd3ff;
        }
        body {
            background-color: var(--ls-bg-main);
            color: var(--ls-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .forgot-password-container {
            background-color: var(--ls-bg-elevated);
            border: 1px solid var(--ls-border-subtle);
            border-radius: 12px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .forgot-password-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .forgot-password-header h1 {
            color: var(--ls-text-main);
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .forgot-password-header p {
            color: var(--ls-text-muted);
            font-size: 14px;
            margin: 0;
        }
        .form-control {
            background-color: rgba(12, 24, 43, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.30);
            color: var(--ls-text-main);
            padding: 12px 16px;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: rgba(12, 24, 43, 0.92);
            border-color: var(--ls-accent);
            color: var(--ls-text-main);
            box-shadow: 0 0 0 0.2rem rgba(143, 211, 255, 0.25);
        }
        .form-control::placeholder {
            color: var(--ls-text-muted);
        }
        .btn-primary {
            background-color: var(--ls-accent);
            border-color: var(--ls-accent);
            color: var(--ls-bg-main);
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #7bc8f0;
            border-color: #7bc8f0;
            color: var(--ls-bg-main);
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--ls-border-subtle);
            color: var(--ls-text-muted);
            padding: 12px 24px;
            border-radius: 8px;
            width: 100%;
        }
        .btn-secondary:hover {
            background-color: rgba(160, 176, 204, 0.1);
            color: var(--ls-text-main);
        }
        .form-label {
            color: var(--ls-text-main);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .alert {
            border-radius: 8px;
            border: none;
            padding: 16px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--ls-accent);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <div class="forgot-password-header">
            <h1><i class="fas fa-key me-2"></i>Esqueci a Senha</h1>
            <p>Informe seu email para receber o código de recuperação</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" 
                       placeholder="seu@email.com" required autofocus>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane me-2"></i>Enviar Código
                </button>
            </div>
        </form>

        <div class="back-link">
            <a href="{{ url_for('auth.login') }}">
                <i class="fas fa-arrow-left me-1"></i>Voltar ao Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
